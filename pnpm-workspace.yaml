packages:
  - 'apps/*'
  - 'packages/*'

# Overrides: keep our existing pins (Privy/axios/sanitize-html/React lockdown)
# plus patches for transitive deps flagged by Dependabot — bn.js, brace-expansion,
# glob, js-cookie, postcss, ws, uuid. bigint-buffer has no upstream patch; left
# to the resolver and tracked separately.
overrides:
  '@privy-io/react-auth': '3.14.1'
  axios: '^1.15.2'
  sanitize-html: '^2.17.4'
  react: '^18.3.1'
  react-dom: '^18.3.1'
  bn.js: '^5.2.3'
  brace-expansion: '^5.0.6'
  glob: '^10.5.0'
  js-cookie: '^3.0.7'
  postcss: '^8.5.10'
  ws: '^8.20.1'
  uuid: '^11.1.1'
