services:
  - type: web
    name: plp-platform
    runtime: node
    region: oregon
    plan: standard
    rootDir: apps/web
    buildCommand: cd ../.. && npm install -g pnpm && pnpm install && pnpm -w run build:web
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_PROD_DATABASE
        sync: false
      - key: NEXT_PUBLIC_SOLANA_NETWORK
        sync: false
      - key: NEXT_PUBLIC_PLP_PROGRAM_ID_MAINNET
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: NEXT_PUBLIC_HELIUS_MAINNET_RPC
        sync: false
      - key: NEXT_PUBLIC_HELIUS_WS_MAINNET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_PINATA_JWT
        sync: false
      - key: NEXT_PUBLIC_PINATA_GATEWAY_URL
        sync: false
      # ORCID verification (verified-researcher badge). Values set in the Render
      # dashboard. ORCID_ENV: 'sandbox' (testing) or 'production' (orcid.org).
      - key: ORCID_ENV
        sync: false
      - key: ORCID_CLIENT_ID
        sync: false
      - key: ORCID_CLIENT_SECRET
        sync: false
      # Zenodo DOI minting (dedicated PNL org account). ZENODO_ENV: 'sandbox' or
      # 'production'. ZENODO_COMMUNITY: the PNL community slug (optional).
      - key: ZENODO_ENV
        sync: false
      - key: ZENODO_TOKEN
        sync: false
      - key: ZENODO_COMMUNITY
        sync: false
      # GitHub App (cut releases that settle milestones). Register a GitHub App
      # with Contents: write; PRIVATE_KEY may be PEM-with-\n or base64.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
