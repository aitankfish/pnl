<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&amp;display=swap');
      .pnl-mark {
        font-family: 'Fraunces', 'Hoefler Text', 'Georgia', 'Times New Roman', serif;
        font-weight: 400;
        font-size: 232px;
        font-feature-settings: "ss01";
        font-variation-settings: "SOFT" 50, "opsz" 144, "WONK" 0;
        letter-spacing: -0.008em;
        fill: #f4eee4;
      }
    </style>

    <radialGradient id="cosmicField" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0%" stop-color="#1a1028"/>
      <stop offset="55%" stop-color="#0c0818"/>
      <stop offset="100%" stop-color="#06040d"/>
    </radialGradient>
  </defs>

  <!-- Cosmic field, app-icon rounded square -->
  <rect width="512" height="512" rx="92" ry="92" fill="url(#cosmicField)"/>

  <!-- Wordmark, optically centered (slight downward nudge for cap-height balance) -->
  <text x="256" y="262"
        text-anchor="middle"
        dominant-baseline="central"
        class="pnl-mark">PNL</text>
</svg>
